version: 2

sources:
  - name: payments
    description: Raw tables loaded by scripts/generate_data.py (simulates the processor's operational DB).
    database: "{{ target.project }}"
    schema: raw
    loader: generate_data.py
    config:
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 7, period: day}
    tables:
      - name: merchants
        description: One row per merchant, current state only. Snapshotted in snapshots/ for history.
        # no loaded_at_field: replaced whole every day, so freshness uses the table's
        columns:
          - name: merchant_id
            tests: [unique, not_null]
      - name: transactions
        config:
          loaded_at_field: created_at
        description: >
          Card transactions. Partitioned by DATE(created_at), clustered by merchant_id.
          Nested `card` STRUCT and repeated `line_items`.
        columns:
          - name: transaction_id
            tests: [unique, not_null]
      - name: refunds
        config:
          loaded_at_field: created_at
      - name: chargebacks
        # no loaded_at_field: replaced whole every day, see merchants 
      - name: payouts
        config:
          loaded_at_field: created_at
        description: Daily settlement per merchant.
