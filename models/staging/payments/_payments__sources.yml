version: 2

sources:
  - name: payments
    description: Raw tables loaded by scripts/generate_data.py (simulates the processor's operational DB).
    database: "{{ target.project }}"
    schema: raw
    loader: generate_data.py
    config:
      loaded_at_field: created_at
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 7, period: day}
    tables:
      - name: merchants
        description: One row per merchant, current state only. Snapshotted in snapshots/ for history.
        config:
          loaded_at_field: updated_at
        columns:
          - name: merchant_id
            tests: [unique, not_null]
      - name: transactions
        description: >
          Card transactions. Partitioned by DATE(created_at), clustered by merchant_id.
          Nested `card` STRUCT and repeated `line_items`.
        columns:
          - name: transaction_id
            tests: [unique, not_null]
      - name: refunds
      - name: chargebacks
        config:
          loaded_at_field: opened_at
      - name: payouts
        description: Daily settlement per merchant.
