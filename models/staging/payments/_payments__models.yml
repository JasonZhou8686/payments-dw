version: 2

models:
  - name: stg_payments__merchants
    description: One row per merchant, current state. Light rename/cast of raw.merchants.
    columns:
      - name: merchant_id
        description: Primary key. Stable identifier, e.g. m_00042.
        tests: [unique, not_null]
      - name: business_name
        description: Legal/trading name.
      - name: industry
        description: Merchant category.
        tests:
          - accepted_values:
              arguments:
                values: [restaurant, retail, salon, contractor, professional_services, ecommerce, fitness]
      - name: plan
        description: Subscription plan.
        tests:
          - accepted_values:
              arguments:
                values: [starter, growth, enterprise]
      - name: status
        description: Lifecycle status.
        tests:
          - accepted_values:
              arguments:
                values: [active, paused, churned, under_review]
      - name: province
        description: Canadian province of the business address.
      - name: signup_date
        description: Date the merchant account was created.
        tests: [not_null]
      - name: monthly_fee_cents
        description: Plan fee in cents. Zero for starter.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: monthly_fee
        description: Plan fee in dollars (NUMERIC).
      - name: updated_at
        description: Last change to this row in the source system (UTC).

  - name: stg_payments__transactions
    description: >
      One row per card transaction. Light rename/cast of raw.transactions. Card fields are flattened
      for filtering; the repeated `line_items` array is kept as-is (not unnested) to preserve the grain.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "transaction_date <= current_date()"
    columns:
      - name: transaction_id
        description: Primary key. Unique identifier of the transaction.
        tests: [unique, not_null]
      - name: merchant_id
        description: Merchant that processed the transaction. FK to stg_payments__merchants.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_payments__merchants')
                field: merchant_id
      - name: created_at
        description: When the transaction was created (UTC).
        tests: [not_null]
      - name: transaction_date
        description: Date the transaction was created, DATE(created_at) in UTC.
        tests: [not_null]
      - name: amount_cents
        description: Transaction amount in cents. Never negative; refunds live in raw.refunds.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: amount
        description: Transaction amount in dollars (NUMERIC).
      - name: fee_cents
        description: Processing fee charged to the merchant, in cents. Never negative.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: fee
        description: Processing fee in dollars (NUMERIC).
      - name: currency
        description: ISO 4217 currency code. Only CAD observed so far; the accepted_values test is intentionally strict and will fail on the first non-CAD transaction so we notice the change.
        tests:
          - accepted_values:
              arguments:
                values: [CAD]
      - name: status
        description: Authorization outcome.
        tests:
          - accepted_values:
              arguments:
                values: [approved, declined, error]
      - name: channel
        description: How the payment was taken.
        tests:
          - accepted_values:
              arguments:
                values: [card_present, online, invoice]
      - name: card
        description: Original card STRUCT (brand, last4, funding, country), kept for completeness.
      - name: card_brand
        description: Card network, flattened from card.brand.
        tests:
          - accepted_values:
              arguments:
                values: [visa, mastercard, amex, discover]
      - name: card_funding
        description: Card funding type, flattened from card.funding.
        tests:
          - accepted_values:
              arguments:
                values: [credit, debit, prepaid]
      - name: card_country
        description: ISO country code of the card issuer, flattened from card.country.
        tests:
          - accepted_values:
              arguments:
                values: [CA, US, GB]
      - name: line_items
        description: Repeated STRUCT of purchased items (sku, description, quantity, unit_price_cents). Not unnested in staging.
      - name: metadata_json
        description: Free-form JSON metadata from the source system, as a raw STRING.
  - name: stg_payments__refunds
    description: >
      One row per refund. Light rename/cast of raw.refunds. Refunds are linked to transactions via transaction_id.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "refund_date <= current_date()"
    columns:
      - name: refund_id
        description: Primary key. Unique identifier of the refund.
        tests: [unique, not_null]
      - name: transaction_id
        description: Transaction that was refunded. FK to stg_payments__transactions.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_payments__transactions')
                field: transaction_id
      - name: merchant_id
        description: Merchant that processed the refund. FK to stg_payments__merchants.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_payments__merchants')
                field: merchant_id
      - name: created_at
        description: When the refund was created (UTC).
        tests: [not_null]
      - name: refund_date
        description: Date the refund was created, DATE(created_at) in UTC.
        tests: [not_null]
      - name: amount_cents
        description: Refund amount in cents. Never negative. May be partial - less than the original transaction amount.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: amount
        description: Refund amount in dollars (NUMERIC).
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: reason
        description: Reason the merchant gave for the refund.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [duplicate, fraudulent, requested_by_customer]

  - name: stg_payments__chargebacks
    description: >
      One row per chargeback (card dispute). Light rename/cast of raw.chargebacks.
      Linked to the disputed transaction via transaction_id.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(status = 'pending') = (resolved_at is null)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "chargeback_date <= current_date()"
    columns:
      - name: chargeback_id
        description: Primary key. Unique identifier of the chargeback.
        tests: [unique, not_null]
      - name: transaction_id
        description: Disputed transaction. FK to stg_payments__transactions.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_payments__transactions')
                field: transaction_id
      - name: merchant_id
        description: Merchant whose transaction was disputed. FK to stg_payments__merchants.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_payments__merchants')
                field: merchant_id
      - name: amount_cents
        description: Disputed amount in cents. Never negative.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: amount
        description: Disputed amount in dollars (NUMERIC).
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: reason_code
        description: Reason the cardholder gave for the dispute.
        tests:
          - accepted_values:
              arguments:
                values: [duplicate, fraud, not_as_described, product_not_received, other]
      - name: status
        description: Dispute outcome. pending until resolved, then won or lost (from the merchant's side).
        tests:
          - accepted_values:
              arguments:
                values: [pending, won, lost]
      - name: opened_at
        description: When the chargeback was opened (UTC). Source freshness field.
        tests: [not_null]
      - name: chargeback_date
        description: Date the chargeback was opened, DATE(opened_at) in UTC.
        tests: [not_null]
      - name: resolved_at
        description: When the chargeback was resolved (UTC). Null while unresolved (status = pending).

  - name: stg_payments__payouts
    description: >
      One row per merchant settlement (daily payout). Light rename/cast of raw.payouts.
      net = gross - fees - refunds.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "net_cents = gross_cents - fees_cents - refunds_cents"
    columns:
      - name: payout_id
        description: Primary key. Unique identifier of the payout.
        tests: [unique, not_null]
      - name: merchant_id
        description: Merchant being paid out. FK to stg_payments__merchants.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_payments__merchants')
                field: merchant_id
      - name: payout_date
        description: Settlement date the payout covers (from the source; not derived from created_at).
        tests: [not_null]
      - name: gross_cents
        description: Total transaction volume settled in this payout, in cents. Never negative.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: gross
        description: Gross settled volume in dollars (NUMERIC).
      - name: fees_cents
        description: Processing fees deducted, in cents. Never negative.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: fees
        description: Fees deducted in dollars (NUMERIC).
      - name: refunds_cents
        description: Refunds deducted, in cents. Never negative.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: refunds
        description: Refunds deducted in dollars (NUMERIC).
      - name: net_cents
        description: >
          Amount paid to the merchant, in cents (gross - fees - refunds). Can be negative when refunds
          and fees exceed gross volume for the day, so it has no min_value test.
        tests: [not_null]
      - name: net
        description: Net payout in dollars (NUMERIC). Can be negative, see net_cents.
      - name: status
        description: Payout state.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pending, paid, failed]
      - name: created_at
        description: When the payout record was created (UTC). Source freshness field.
        tests: [not_null]
          
