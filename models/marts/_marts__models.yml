version: 2

models:
  - name: dim_merchants
    description: >
      One row per merchant: current attributes, lifetime activity from approved transactions only (declined/error excluded). FK to `stg_payments__merchants.merchant_id`.
      Every merchant appears, including those with no approved transactions (in which case lifetime activity fields are NULL).
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: ref('stg_payments__merchants')
    columns:
      - name: merchant_id
        description: The merchant's unique identifier; primary key for this table, FK to `stg_payments__merchants.merchant_id`.
        tests: 
          - unique
          - not_null
          - relationships:
              to: ref('stg_payments__merchants')
              field: merchant_id
      - name: business_name
        description: The merchant's business name, as provided by the merchant.
      - name: industry
        description: The merchant's industry, as provided by the merchant.
        tests:
          - accepted_values:
              values: ['restaurant', 'retail', 'salon', 'contractor', 'professional_services', 'ecommerce', 'fitness']
      - name: plan
        description: current subscription plan for the merchant.
        tests:
          - accepted_values:
              values: ['starter', 'growth', 'enterprise']
      - name: status
        description: current lifecycle status for the merchant.
        tests:
          - accepted_values:
              values: ['active', 'paused', 'churned', 'under_review']
      - name: is_active
        description: True when status is 'active', false otherwise.
        tests: [not_null]
      - name: province
        description: The merchant's province, as provided by the merchant.
      - name: signup_date
        description: Date the merchant account was created (UTC).
        tests:
          - not_null
      - name: tenure_days
        description: >
          Days from signup_date to the date the table was built. Changes on every rebuild, so it is not reproducible for a past date.
      - name: monthly_fee_cents
        description: Monthly subscription fee for the merchant, in cents.
      - name: monthly_fee_currency
        description: Currency of the monthly subscription fee in dollars for the merchant. (NUMERIC)
      - name: has_transacted
        description: True when the merchant has at least one approved transaction, false otherwise.
        tests: [not_null]
      - name: first_transaction_date
        description: Date of the merchant's first approved transaction (UTC).
      - name: last_transaction_date
        description: Date of the merchant's most recent approved transaction. Null if has_transacted is false.
      - name: lifetime_transaction_count
        description: Total number of approved transactions for this merchant, all time. 0 (not null) for merchants that never transacted.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: lifetime_gross_volume_cents
        description: Total gross volume (sum of `amount_cents`) for this merchant, in cents. 0 for merchants that never transacted.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: lifetime_fee_cents
        description: Total fees (sum of `fee_cents`) earned from this merchant. Our revenue from them, in cents.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
  - name: fct_transactions
    description: >
      One row per card transaction, all statuses. Incremental (insert_overwrite) partitioned by
      transaction_date and clustered by merchant_id. Each run reprocesses the trailing 14 days to
      pick up late refunds (refunds arrive up to ~14 days after the transaction). Chargebacks can
      arrive up to ~60 days later and are NOT reflected here. Refund totals are joined inline
      (only this model needs them); promote to an intermediate model if reused.
      Run with --full-refresh after schema changes.
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: ref('stg_payments__transactions')
      - dbt_utils.expression_is_true:
          arguments:
            expression: "refunded_amount_cents <= amount_cents"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "net_amount_cents = amount_cents - refunded_amount_cents"
    columns:
      - name: transaction_id
        description: The transaction's unique identifier; primary key for this table, FK to `stg_payments__transactions.transaction_id`.
        tests: 
          - unique
          - not_null
      - name: merchant_id
        description: The merchant's unique identifier; FK to `dim_merchants.merchant_id`.
        tests:
          - not_null
          - relationships:
              to: ref('dim_merchants')
              field: merchant_id
      - name: transaction_date
        description: Date of the transaction (UTC). Derived from `created_at` timestamp.
        tests:
          - not_null
      - name: created_at
        description: Timestamp when the transaction was created (UTC).
        tests:
          - not_null
      - name: status
        description: Transaction status, as provided by the processor.
        tests:
          - accepted_values:
              arguments:
                values: ['approved', 'declined', 'error']
      - name: is_approved
        description: True when status is 'approved', false otherwise.
        tests: [not_null]
      - name: channel
        description: How the payment was taken.
      - name: currency
        description: ISO 4217 currency code for the transaction amount.
      - name: card_brand
        description: Card network, as provided by the processor.
      - name: card_funding
        description: Credit, debit or prepaid, as provided by the processor.
      - name: card_country
        description: Country of the card, as provided by the processor.
      - name: amount_cents
        description: Transaction amount in cents.
        tests:
          - not_null
      - name: fee_cents
        description: Fee charged for the transaction, in cents. 0 for non-approved transactions (declined/error).
        tests:
          - not_null
      - name: refunded_amount_cents
        description: Total amount refunded for the transaction, in cents. 0 for non-approved transactions
        tests:
          - not_null
      - name: is_refunded
        description: True when refunded_amount_cents > 0, false otherwise.
        tests: [not_null]
      - name: net_amount_cents
        description: amount_cents - refunded_amount_cents.
        tests:
          - not_null

  - name: fct_merchant_daily_revenue
    description: >
      One row per merchant per UTC day (merchant_id, activity_date) summarising money movement, for the
      merchant-health dashboard and as a churn-model feature table. A row exists only for days with at least
      one approved transaction, refund or chargeback; days with refunds or chargebacks but no sales are included.
      Refunds are dated by when they were created and chargebacks by when they were opened, not by the original
      transaction's day. Chargebacks are deducted when opened regardless of outcome, so net_volume_cents is
      exposure, not final settlement. plan and industry are the values at the time the partition was last built;
      they are not updated if the merchant changes later. Join dim_merchants on merchant_id for current values.
      Incremental (insert_overwrite) partitioned by activity_date, clustered by merchant_id; each run reprocesses
      the last 3 days to cover load delay. Filter on activity_date to keep queries cheap.
      After reloading raw data, run dbt build --full-refresh --select fct_transactions+.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [merchant_id, activity_date]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "fee_revenue_cents <= gross_volume_cents"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "net_volume_cents = gross_volume_cents - refund_amount_cents - chargeback_amount_cents"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "transaction_count + refund_count + chargeback_count > 0"
    columns:
      - name: merchant_daily_id
        description: Primary key. Surrogate key of merchant_id and activity_date.
        tests: [unique, not_null]
      - name: merchant_id
        description: The merchant's unique identifier; FK to `dim_merchants.merchant_id`.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_merchants')
                field: merchant_id
      - name: activity_date
        description: UTC calendar day of the activity. Partition column.
        tests: [not_null]
      - name: plan
        description: >
          Merchant's subscription plan from dim_merchants, as of the time the partition was last built. Not updated
          if the merchant changes later; join dim_merchants on merchant_id for the current value.
        tests:
          - accepted_values:
              arguments:
                values: ['starter', 'growth', 'enterprise']
      - name: industry
        description: >
          Merchant's industry from dim_merchants, as of the time the partition was last built. Not updated
          if the merchant changes later; join dim_merchants on merchant_id for the current value.
        tests:
          - accepted_values:
              arguments:
                values: ['restaurant', 'retail', 'salon', 'contractor', 'professional_services', 'ecommerce', 'fitness']
      - name: transaction_count
        description: Number of approved transactions that day. 0 if none.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: gross_volume_cents
        description: Sum of amount_cents on approved transactions that day, in cents. 0 if none.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: fee_revenue_cents
        description: Sum of fee_cents on approved transactions that day, in cents. This is our revenue. 0 if none.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: refund_count
        description: Number of refunds created that day (any original transaction date). 0 if none.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: refund_amount_cents
        description: Sum of refunds created that day, in cents. 0 if none.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: chargeback_count
        description: Number of chargebacks opened that day, whatever their outcome. 0 if none.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: chargeback_amount_cents
        description: Sum of chargeback amounts opened that day, in cents, whatever their outcome. 0 if none.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: net_volume_cents
        description: >
          gross_volume_cents - refund_amount_cents - chargeback_amount_cents, in cents. Can be negative (refunds or
          chargebacks on a day with little or no sales), so it has no >= 0 test. Chargebacks are deducted when opened,
          regardless of outcome: this is exposure, not final settlement.
        tests: [not_null]
      - name: avg_ticket_cents
        description: >
          Average approved transaction amount that day, in cents (NUMERIC, 2 decimals, so can be fractional cents):
          gross_volume_cents / transaction_count. Null when transaction_count = 0.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0