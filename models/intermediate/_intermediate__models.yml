version: 2

models:
  - name: int_merchants__transaction_summary
    description: >
      One row per merchant with at least one approved transaction, Lifetime actvity aggregated from approved transactions only (declined/error excluded).
    columns:
      - name: merchant_id
        description: The merchant's unique identifier; primary key for this table, FK to `stg_payments__merchants.merchant_id`.
        tests: 
          - unique
          - not_null
          - relationships:
              to: ref('stg_payments__merchants')
              field: merchant_id
      - name: first_transaction_date
        description: Date of the merchant's first approved transaction (UTC).
        tests:
          - not_null
      - name: last_transaction_date
        description: Date of the merchant's most recent approved transaction.
        tests:
          - not_null
      - name: lifetime_transaction_count
        description: Total number of approved transactions for this merchant, all time.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: lifetime_gross_volume_cents
        description: Total gross volume (sum of `amount_cents`) for this merchant, in cents.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: lifetime_fee_cents
        description: Total fees (sum of `fee_cents`) earned from this merchant. Our revenue from them, in cents.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0