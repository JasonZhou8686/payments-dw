name: dbt CI

on:
  pull_request:
    paths: ["models/**", "snapshots/**", "tests/**", "macros/**", "dbt_project.yml", "packages.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      DBT_KEYFILE: ${{ github.workspace }}/sa.json
      DBT_PROFILES_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Write service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > sa.json
      - name: Write profiles.yml
        run: cp profiles.yml.example profiles.yml
      - run: dbt deps
      - run: dbt debug --target ci
      - run: dbt build --target ci --fail-fast
      - name: Remove key
        if: always()
        run: rm -f sa.json
